<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keystroke Rhythm Analyzer</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  canvas { display: block; }
  #typing-area:focus { outline: none; }
</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center p-6">
  <div class="w-full max-w-3xl">
    <h1 class="text-3xl font-bold text-center mb-1 text-cyan-400">Keystroke Rhythm Analyzer</h1>
    <p class="text-center text-gray-400 text-sm mb-6">Type anything below to record your unique typing DNA</p>

    <!-- Typing area -->
    <div class="relative mb-4">
      <textarea
        id="typing-area"
        class="w-full bg-gray-900 border border-gray-700 rounded-lg p-4 text-gray-100 text-base resize-none focus:border-cyan-500 transition-colors"
        rows="4"
        placeholder="Start typing here..."
      ></textarea>
    </div>

    <!-- Buttons -->
    <div class="flex gap-3 mb-6">
      <button id="reset-btn" class="px-5 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm font-medium transition-colors">
        Reset
      </button>
      <button id="copy-btn" class="px-5 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm font-medium transition-colors">
        Copy DNA
      </button>
      <span id="copy-msg" class="self-center text-green-400 text-sm opacity-0 transition-opacity">Copied!</span>
    </div>

    <!-- Stats row -->
    <div id="stats-grid" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
      <div class="bg-gray-900 rounded-lg p-3 text-center">
        <div class="text-xs text-gray-400 mb-1">Total Keystrokes</div>
        <div id="stat-total" class="text-2xl font-bold text-cyan-400">0</div>
      </div>
      <div class="bg-gray-900 rounded-lg p-3 text-center">
        <div class="text-xs text-gray-400 mb-1">Avg Interval (ms)</div>
        <div id="stat-avg" class="text-2xl font-bold text-yellow-400">—</div>
      </div>
      <div class="bg-gray-900 rounded-lg p-3 text-center">
        <div class="text-xs text-gray-400 mb-1">Std Deviation</div>
        <div id="stat-std" class="text-2xl font-bold text-purple-400">—</div>
      </div>
      <div class="bg-gray-900 rounded-lg p-3 text-center">
        <div class="text-xs text-gray-400 mb-1">WPM (est.)</div>
        <div id="stat-wpm" class="text-2xl font-bold text-green-400">—</div>
      </div>
    </div>

    <!-- Min/Max row -->
    <div class="grid grid-cols-2 gap-3 mb-6">
      <div class="bg-gray-900 rounded-lg p-3">
        <div class="text-xs text-gray-400 mb-1">Fastest Interval</div>
        <div class="flex items-center gap-2">
          <div id="stat-min" class="text-xl font-bold text-green-400">—</div>
          <div id="stat-min-key" class="text-xs text-gray-500"></div>
        </div>
      </div>
      <div class="bg-gray-900 rounded-lg p-3">
        <div class="text-xs text-gray-400 mb-1">Slowest Interval</div>
        <div class="flex items-center gap-2">
          <div id="stat-max" class="text-xl font-bold text-red-400">—</div>
          <div id="stat-max-key" class="text-xs text-gray-500"></div>
        </div>
      </div>
    </div>

    <!-- Waveform canvas -->
    <div class="bg-gray-900 rounded-lg p-4 mb-6">
      <div class="text-xs text-gray-400 mb-3">Keystroke Rhythm Waveform</div>
      <canvas id="waveform" class="w-full rounded" height="120"></canvas>
    </div>

    <!-- DNA Analysis -->
    <div id="dna-card" class="bg-gray-900 rounded-lg p-4 mb-6 hidden">
      <div class="text-sm font-semibold text-cyan-400 mb-2">Your Typing DNA</div>
      <div id="dna-text" class="text-sm text-gray-300 leading-relaxed"></div>
    </div>

    <!-- Recent intervals table -->
    <div class="bg-gray-900 rounded-lg p-4">
      <div class="text-xs text-gray-400 mb-3">Recent Key Intervals (last 20)</div>
      <div id="interval-list" class="flex flex-wrap gap-2">
        <span class="text-xs text-gray-600">No data yet</span>
      </div>
    </div>
  </div>

<script>
const textarea = document.getElementById('typing-area');
const waveformCanvas = document.getElementById('waveform');
const ctx = waveformCanvas.getContext('2d');

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

let intervals = [];        // { from, to, ms } objects
let lastKeyTime = null;
let lastKey = '';
let startTime = null;

function resizeCanvas() {
  waveformCanvas.width = waveformCanvas.offsetWidth;
}
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); drawWaveform(); });

textarea.addEventListener('keydown', (e) => {
  const now = performance.now();
  if (lastKeyTime !== null) {
    const ms = Math.round(now - lastKeyTime);
    if (ms > 0 && ms < 3000) { // ignore pauses > 3s
      intervals.push({ from: lastKey, to: e.key, ms });
    }
  } else {
    startTime = now;
  }
  lastKeyTime = now;
  lastKey = e.key;
  updateAll();
});

textarea.addEventListener('blur', () => {
  lastKeyTime = null;
});

function calcStats() {
  if (intervals.length === 0) return null;
  const ms = intervals.map(i => i.ms);
  const avg = ms.reduce((a, b) => a + b, 0) / ms.length;
  const variance = ms.reduce((a, b) => a + Math.pow(b - avg, 2), 0) / ms.length;
  const std = Math.sqrt(variance);
  const min = Math.min(...ms);
  const max = Math.max(...ms);
  const minIdx = ms.indexOf(min);
  const maxIdx = ms.indexOf(max);
  return { avg, std, min, max, minIdx, maxIdx, ms };
}

function updateStats(stats) {
  const totalKeys = intervals.length + 1;
  document.getElementById('stat-total').textContent = totalKeys;

  if (!stats) return;

  document.getElementById('stat-avg').textContent = Math.round(stats.avg);
  document.getElementById('stat-std').textContent = Math.round(stats.std);
  document.getElementById('stat-min').textContent = stats.min + ' ms';
  document.getElementById('stat-max').textContent = stats.max + ' ms';

  const fromMin = intervals[stats.minIdx];
  const fromMax = intervals[stats.maxIdx];
  document.getElementById('stat-min-key').textContent =
    fromMin ? `"${fromMin.from}" → "${fromMin.to}"` : '';
  document.getElementById('stat-max-key').textContent =
    fromMax ? `"${fromMax.from}" → "${fromMax.to}"` : '';

  // WPM estimate: (chars / 5) / minutes
  const elapsedMin = (performance.now() - startTime) / 60000;
  const chars = textarea.value.length;
  const wpm = elapsedMin > 0 ? Math.round((chars / 5) / elapsedMin) : 0;
  document.getElementById('stat-wpm').textContent = wpm;
}

function drawWaveform() {
  const w = waveformCanvas.width;
  const h = waveformCanvas.height;
  ctx.clearRect(0, 0, w, h);

  // Background
  ctx.fillStyle = '#030712';
  ctx.fillRect(0, 0, w, h);

  if (intervals.length < 2) {
    ctx.fillStyle = '#374151';
    ctx.font = '12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('Keep typing to see your rhythm waveform...', w / 2, h / 2);
    return;
  }

  const ms = intervals.map(i => i.ms);
  const maxMs = Math.max(...ms);
  const minMs = Math.min(...ms);
  const range = maxMs - minMs || 1;

  const padding = 16;
  const plotW = w - padding * 2;
  const plotH = h - padding * 2;
  const step = plotW / (ms.length - 1);

  // Grid lines
  ctx.strokeStyle = '#1f2937';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = padding + (plotH / 4) * i;
    ctx.beginPath();
    ctx.moveTo(padding, y);
    ctx.lineTo(w - padding, y);
    ctx.stroke();
  }

  // Gradient fill under curve
  const grad = ctx.createLinearGradient(0, padding, 0, h - padding);
  grad.addColorStop(0, 'rgba(6,182,212,0.4)');
  grad.addColorStop(1, 'rgba(6,182,212,0.0)');

  ctx.beginPath();
  ms.forEach((v, i) => {
    const x = padding + i * step;
    const y = padding + plotH * (1 - (v - minMs) / range);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.lineTo(padding + (ms.length - 1) * step, h - padding);
  ctx.lineTo(padding, h - padding);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Line
  ctx.beginPath();
  ctx.strokeStyle = '#06b6d4';
  ctx.lineWidth = 2;
  ms.forEach((v, i) => {
    const x = padding + i * step;
    const y = padding + plotH * (1 - (v - minMs) / range);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // Dots for recent points
  const lastN = Math.min(5, ms.length);
  ms.slice(-lastN).forEach((v, idx) => {
    const i = ms.length - lastN + idx;
    const x = padding + i * step;
    const y = padding + plotH * (1 - (v - minMs) / range);
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#67e8f9';
    ctx.fill();
  });

  // Y axis labels
  ctx.fillStyle = '#6b7280';
  ctx.font = '10px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(maxMs + 'ms', 2, padding + 8);
  ctx.fillText(minMs + 'ms', 2, h - padding);
}

function updateIntervalList() {
  const list = document.getElementById('interval-list');
  const recent = intervals.slice(-20);
  if (recent.length === 0) {
    list.innerHTML = '<span class="text-xs text-gray-600">No data yet</span>';
    return;
  }
  const avg = recent.reduce((a, b) => a + b.ms, 0) / recent.length;
  list.innerHTML = recent.map(({ from, to, ms }) => {
    const ratio = ms / avg;
    let color = 'bg-cyan-900 text-cyan-300';
    if (ratio < 0.7) color = 'bg-green-900 text-green-300';
    else if (ratio > 1.5) color = 'bg-red-900 text-red-300';
    const fromDisplay = from === ' ' ? '⎵' : from === 'Enter' ? '↵' : from.length > 2 ? '…' : escapeHtml(from);
    const toDisplay = to === ' ' ? '⎵' : to === 'Enter' ? '↵' : to.length > 2 ? '…' : escapeHtml(to);
    return `<span class="text-xs px-2 py-1 rounded ${color}" title="${escapeHtml(from)}→${escapeHtml(to)}: ${ms}ms">${fromDisplay}→${toDisplay}: ${ms}ms</span>`;
  }).join('');
}

function generateDNA(stats) {
  if (!stats || intervals.length < 10) {
    document.getElementById('dna-card').classList.add('hidden');
    return;
  }
  document.getElementById('dna-card').classList.remove('hidden');

  const cv = stats.std / stats.avg; // coefficient of variation
  const rhythmType = cv < 0.2 ? 'Metronome' : cv < 0.4 ? 'Steady' : cv < 0.6 ? 'Variable' : 'Erratic';
  const speedType = stats.avg < 100 ? 'Lightning Fast' : stats.avg < 180 ? 'Fast' : stats.avg < 280 ? 'Moderate' : 'Deliberate';

  // Find most common transition
  const transMap = {};
  intervals.forEach(({ from, to }) => {
    const key = `${from}→${to}`;
    transMap[key] = (transMap[key] || 0) + 1;
  });
  const topTrans = Object.entries(transMap).sort((a, b) => b[1] - a[1])[0];

  // Burst detection: consecutive fast keystrokes
  const ms = intervals.map(i => i.ms);
  const fastThreshold = stats.avg * 0.6;
  let maxBurst = 0, curBurst = 0;
  ms.forEach(v => {
    if (v < fastThreshold) { curBurst++; maxBurst = Math.max(maxBurst, curBurst); }
    else curBurst = 0;
  });

  const dna = [
    `🎵 <strong>Rhythm Class:</strong> ${rhythmType} — your timing variation is ${Math.round(cv * 100)}%`,
    `⚡ <strong>Speed Class:</strong> ${speedType} — ${Math.round(stats.avg)}ms average interval`,
    `📊 <strong>Consistency:</strong> ${Math.round(stats.std)}ms std deviation (lower = more robotic precision)`,
    `🔥 <strong>Longest burst:</strong> ${maxBurst} consecutive fast keystrokes (< ${Math.round(fastThreshold)}ms)`,
    topTrans ? `🔤 <strong>Fastest transition:</strong> "${escapeHtml(topTrans[0])}" appeared ${topTrans[1]} times` : '',
    `🧬 <strong>DNA Fingerprint:</strong> ${rhythmType[0]}${speedType[0]}${Math.round(cv * 10)}${Math.round(stats.avg / 10)}${maxBurst}`,
  ].filter(Boolean).join('<br>');

  document.getElementById('dna-text').innerHTML = dna;
}

function updateAll() {
  const stats = calcStats();
  updateStats(stats);
  drawWaveform();
  updateIntervalList();
  generateDNA(stats);
}

// Reset
document.getElementById('reset-btn').addEventListener('click', () => {
  intervals = [];
  lastKeyTime = null;
  lastKey = '';
  startTime = null;
  textarea.value = '';
  document.getElementById('stat-total').textContent = '0';
  ['stat-avg','stat-std','stat-wpm','stat-min','stat-max'].forEach(id => {
    document.getElementById(id).textContent = '—';
  });
  ['stat-min-key','stat-max-key'].forEach(id => {
    document.getElementById(id).textContent = '';
  });
  document.getElementById('interval-list').innerHTML = '<span class="text-xs text-gray-600">No data yet</span>';
  document.getElementById('dna-card').classList.add('hidden');
  drawWaveform();
  textarea.focus();
});

// Copy DNA
document.getElementById('copy-btn').addEventListener('click', () => {
  const stats = calcStats();
  if (!stats) { return; }
  const cv = stats.std / stats.avg;
  const text = [
    '=== Typing DNA ===',
    `Total keystrokes: ${intervals.length + 1}`,
    `Average interval: ${Math.round(stats.avg)}ms`,
    `Std deviation: ${Math.round(stats.std)}ms`,
    `Fastest: ${stats.min}ms  Slowest: ${stats.max}ms`,
    `CV: ${Math.round(cv * 100)}%`,
    `Fingerprint: ${Math.round(stats.avg)}/${Math.round(stats.std)}/${stats.min}/${stats.max}`,
  ].join('\n');
  navigator.clipboard.writeText(text).then(() => {
    const msg = document.getElementById('copy-msg');
    msg.style.opacity = '1';
    setTimeout(() => { msg.style.opacity = '0'; }, 2000);
  });
});

// Initial draw
drawWaveform();
textarea.focus();
</script>
</body>
</html>
